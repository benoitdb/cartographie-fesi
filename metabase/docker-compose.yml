services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      # 127.0.0.1 : sans hôte, Docker publie sur toutes les interfaces et
      # contourne le pare-feu — base joignable depuis le réseau local (#188).
      # Ports alignés sur outils.sh.
      - "127.0.0.1:5437:5432"

  geojson:
    image: python:3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
    command: python -m http.server 80 --directory /geo
    volumes:
      - ../data/geo:/geo:ro
    expose:
      - "80"

  metabase:
    image: metabase/metabase:v0.65.6.3@sha256:e81484135446e08660c78c47b6b1d92ccb39a1b27f4c681769d2a31877c2d70d
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_APP_USER}
      MB_DB_PASS: ${METABASE_APP_PASSWORD}
      MB_DB_HOST: postgres
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
      - geojson

volumes:
  pgdata:
