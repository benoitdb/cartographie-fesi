services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      # 127.0.0.1 : sans hôte, Docker publie sur toutes les interfaces et
      # contourne le pare-feu — base joignable depuis le réseau local (#188).
      # Ports alignés sur outils.sh.
      - "127.0.0.1:5437:5432"

  geojson:
    image: python:3.11-slim
    command: python -m http.server 80 --directory /geo
    volumes:
      - ../frontend/public/geo:/geo:ro
    expose:
      - "80"

  metabase:
    image: metabase/metabase:latest
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
      - geojson

volumes:
  pgdata:
