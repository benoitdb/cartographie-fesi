name: CI

# Les tests ne valent que s'ils tournent sans qu'on y pense : sans CI, une suite
# de tests devient un fichier qu'on oublie de lancer.
#
# Tous les tests de ce dépôt tournent sur un clone nu : aucun ne lit le XLSX
# source ni les JSON générés, qui ne sont pas versionnés. Les tests du pipeline
# éprouvent la logique sur des cas construits ; ceux du dashboard lisent la
# fixture committée dans tests/fixtures/ (voir son README).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      # Lint seulement : `ruff format` n'est pas activé sur ce dépôt. Reformater
      # 29 fichiers sur 38 (~3 300 lignes) produirait un diff que rien ne valide.
      # Le dashboard a désormais des tests de fumée, mais ils ne prouvent que
      # l'absence d'exception — pas que l'affichage est inchangé. À reconsidérer
      # quand la couche de calcul sera couverte.
      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  # Recoupe les vues SQL (metabase/init/*.sql) contre les agrégats Python
  # (agregats.py) et la fusion des six sources 2014-2020 (periodes.py).
  # Job SÉPARÉ des tests : il a besoin d'un PostgreSQL chargé, que la suite
  # principale n'a aucune raison d'installer, et il doit pouvoir échouer sans
  # masquer un échec de test.
  #
  # Les Parquet sont committés (#119, #132), et le service PostgreSQL de GitHub
  # Actions fournit l'infrastructure qu'il manquait (#125, #148) : `load_data.py`
  # charge les données depuis les Parquet/JSON du clone, puis les trois scripts
  # de vérification recoupent les vues SQL contre la couche Python.
  verify-metabase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fesi
          POSTGRES_USER: fesi
          POSTGRES_PASSWORD: fesi_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fesi -d fesi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: fesi
      POSTGRES_USER: fesi
      POSTGRES_PASSWORD: fesi_local
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements-dev.txt
          pip install psycopg2-binary

      - name: Appliquer le schéma et les vues SQL
        run: |
          for f in metabase/init/*.sql; do
            psql -h localhost -U fesi -d fesi -f "$f"
          done
        env:
          PGPASSWORD: fesi_local

      - name: Charger les données
        run: python metabase/load_data.py

      - name: Vérifier les agrégats (SQL vs JSON)
        run: python metabase/verify_aggregates.py

      - name: Vérifier la fusion 2014-2020 (SQL vs dashboard)
        run: python metabase/verify_pilotage_2014_2020.py

      - name: Vérifier les vues unifiées (double-comptage, complétude, plafonds)
        run: python metabase/verify_vues_unifiees.py

  # Recoupe les marts dbt contre `agregats.calculer_agregats`, la règle qui
  # alimente le dashboard. Job SÉPARÉ des tests : il a ses propres dépendances
  # (dbt-core + dbt-duckdb, ~200 Mo) que la suite principale n'a aucune raison
  # d'installer, et il doit pouvoir échouer sans masquer un échec de test.
  #
  # La cible DuckDB ne demande aucune infrastructure — pas de PostgreSQL, pas
  # de Docker. Elle lit les Parquet directement, et ceux-ci sont committés
  # depuis le déploiement Streamlit Cloud (#119) puis la bascule Parquet (#132).
  # Le clone nu a donc tout ce qu'il faut.
  #
  # Couverture : les 6 marts de base (partitions d'`agregats.py`) plus les
  # contrôles de complétude et de planchage. Les marts 2014-2020 n'ont pas
  # d'oracle Python équivalent — leur vérité est la vue SQL, absente du clone nu
  # — et les couvrir supposerait soit de figer des valeurs de référence, soit de
  # réimplémenter la règle côté test, ce qui recréerait une duplication.
  # Arbitrage assumé (issue #135).
  equivalence-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dbt et le pipeline
        run: |
          pip install -r requirements-dbt.txt
          pip install -r data-pipeline/requirements.txt

      # Le staging et les seeds sont GÉNÉRÉS depuis le Python (schema_source,
      # periodes, cofinancement) : les régénérer ici vérifie au passage que le
      # SQL committé est bien à jour — voir l'étape suivante.
      - name: Générer le staging, les seeds et les règles
        run: python dbt/generer.py

      # Si la génération produit un diff, c'est que quelqu'un a modifié une règle
      # Python sans relancer le codegen : le SQL committé et la règle ont divergé.
      # C'est exactement le scénario que l'issue #125 décrit, attrapé sans base.
      - name: Le SQL généré est-il à jour ?
        run: git diff --exit-code -- dbt/

      - name: Construire les modèles (DuckDB)
        working-directory: dbt
        run: dbt build --profiles-dir . --target duckdb

      - name: Équivalence avec les agrégats Python
        run: python dbt/verifier_equivalence.py
