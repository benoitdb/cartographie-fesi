name: CI

# Les tests ne valent que s'ils tournent sans qu'on y pense : sans CI, une suite
# de tests devient un fichier qu'on oublie de lancer.
#
# Tous les tests de ce dépôt tournent sur un clone nu : aucun ne lit le XLSX
# source ni les JSON générés, qui ne sont pas versionnés. Les tests du pipeline
# éprouvent la logique sur des cas construits ; ceux du dashboard lisent la
# fixture committée dans tests/fixtures/ (voir son README).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      # Lint seulement : `ruff format` n'est pas activé sur ce dépôt. Reformater
      # 29 fichiers sur 38 (~3 300 lignes) produirait un diff que rien ne valide.
      # Le dashboard a désormais des tests de fumée, mais ils ne prouvent que
      # l'absence d'exception — pas que l'affichage est inchangé. À reconsidérer
      # quand la couche de calcul sera couverte.
      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
