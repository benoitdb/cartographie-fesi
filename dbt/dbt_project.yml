# Projet dbt du spike (issue #135). Isolé dans `dbt/` : rien ici n'est importé
# par le dashboard ni par le pipeline, et `requirements-dbt.txt` est séparé de
# `dashboard/requirements.txt` — dbt ne doit jamais partir sur Streamlit Cloud.
name: fesi
version: "0.1.0"
profile: fesi

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  fesi:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  fesi:
    +quote_columns: false

vars:
  # Chemin des Parquet, relatif au répertoire depuis lequel dbt est lancé.
  # Lancer dbt DEPUIS `dbt/` : DuckDB résout ce chemin contre le cwd du process.
  chemin_data: "../data/processed"

  # LES DEUX RÈGLES DE LA PÉRIODE 2014-2020, en données et non en SQL écrit en
  # dur (sonde du spike, issue #135 étape 6 — répond à #125).
  #
  # Source de vérité Python : le `if/elif` de pages/5_Période_2014-2020.py pour
  # la substitution, `periodes.REGIONS_PON_FSE_2014_2020` pour le routage. Dans
  # une mise en œuvre réelle, `generer.py` les écrirait ici au lieu qu'elles
  # soient saisies — c'est le même codegen que pour le staging.
  regions_substituees_2014_2020: ["Bretagne", "Normandie", "Nouvelle-Aquitaine"]
  routage_pon_fse_2014_2020:
    "PO réunion": "La Réunion"
    "PO Guadeloupe": "Guadeloupe"
    "PO Martinique": "Martinique"
    "PO Guyane": "Guyane"
    "PO Mayotte": "Mayotte"
